<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0f1923"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="bucket-fill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb"/>
      <stop offset="100%" style="stop-color:#388bfd; stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ea043"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <linearGradient id="bar-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149"/>
      <stop offset="100%" style="stop-color:#da3633"/>
    </linearGradient>
    <filter id="fg">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fg2">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bucket-clip">
      <rect x="546" y="28" width="48" height="62" rx="4"/>
    </clipPath>

    <!-- Paths for request packets -->
    <path id="req-path-1" d="M 0 70 L 520 70" fill="none"/>
    <path id="req-path-2" d="M 0 55 L 520 55" fill="none"/>
    <path id="req-path-3" d="M 0 85 L 520 85" fill="none"/>

    <!-- Paths for passed requests (after gate) -->
    <path id="pass-path-1" d="M 620 60 L 1200 60" fill="none"/>
    <path id="pass-path-2" d="M 620 75 L 1200 75" fill="none"/>

    <!-- Paths for rejected requests (deflected down) -->
    <path id="reject-path-1" d="M 590 90 Q 650 120 750 125" fill="none"/>
    <path id="reject-path-2" d="M 590 95 Q 680 130 800 130" fill="none"/>
  </defs>

  <style>
    /* ── Grid ── */
    @keyframes fgridPulse { 0%,100%{opacity:0.03} 50%{opacity:0.06} }
    .fgrid { stroke:#30363d; stroke-width:0.4; animation:fgridPulse 5s ease-in-out infinite; }

    /* ── Token bucket fill animation ── */
    @keyframes bucketLevel {
      0% { y: 52; height: 38; }
      15% { y: 58; height: 32; }
      30% { y: 48; height: 42; }
      45% { y: 56; height: 34; }
      60% { y: 44; height: 46; }
      75% { y: 52; height: 38; }
      90% { y: 40; height: 50; }
      100% { y: 52; height: 38; }
    }
    .bucket-water {
      fill: url(#bucket-fill);
      opacity: 0.7;
      animation: bucketLevel 12s ease-in-out infinite;
    }

    /* ── Token drops falling into bucket ── */
    @keyframes tokenDrop {
      0% { transform: translateY(-18px); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(20px); opacity: 0; }
    }
    .token-drop { fill: #58a6ff; animation: tokenDrop 2s ease-in infinite; }

    /* ── Gate bar pulse ── */
    @keyframes gatePulse {
      0%,100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .gate-bar { animation: gatePulse 2s ease-in-out infinite; }

    /* ── Counter text ── */
    @keyframes counterPulse {
      0%,100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* ── Labels ── */
    .label {
      font-family: 'Segoe UI', Ubuntu, sans-serif;
      font-weight: 600;
      font-size: 9px;
      fill: #8b949e;
      text-anchor: middle;
    }
    .label-bright {
      font-family: 'Segoe UI', Ubuntu, sans-serif;
      font-weight: 700;
      font-size: 10px;
      fill: #e6edf3;
      text-anchor: middle;
    }
    .label-code {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: 8px;
      fill: #7ee787;
      text-anchor: middle;
    }
    .label-429 {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: 8px;
      fill: #f85149;
      text-anchor: middle;
    }
    .label-header {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 400;
      font-size: 7px;
      fill: #484f58;
      text-anchor: middle;
    }

    /* ── Throughput bar animation ── */
    @keyframes barGrow1 { 0%{height:0;y:95} 100%{height:35;y:60} }
    @keyframes barGrow2 { 0%{height:0;y:95} 100%{height:28;y:67} }
    @keyframes barGrow3 { 0%{height:0;y:95} 100%{height:42;y:53} }
    @keyframes barGrow4 { 0%{height:0;y:95} 100%{height:20;y:75} }
    @keyframes barGrow5 { 0%{height:0;y:95} 100%{height:38;y:57} }
    @keyframes barPulse { 0%,100%{opacity:0.7} 50%{opacity:1} }

    .tbar { rx: 2; animation: barPulse 3s ease-in-out infinite; }
    .tb1 { animation: barGrow1 1s ease-out 0.5s both, barPulse 3s ease-in-out 1.5s infinite; }
    .tb2 { animation: barGrow2 1s ease-out 0.7s both, barPulse 3s ease-in-out 1.7s infinite; }
    .tb3 { animation: barGrow3 1s ease-out 0.9s both, barPulse 3s ease-in-out 1.9s infinite; }
    .tb4 { animation: barGrow4 1s ease-out 1.1s both, barPulse 3s ease-in-out 2.1s infinite; }
    .tb5 { animation: barGrow5 1s ease-out 1.3s both, barPulse 3s ease-in-out 2.3s infinite; }

    /* ── Sliding window bracket ── */
    @keyframes windowSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(24px); }
    }
    .slide-window {
      stroke: #58a6ff;
      stroke-width: 1.5;
      fill: none;
      opacity: 0.4;
      animation: windowSlide 4s ease-in-out infinite alternate;
    }

    /* ── Request dots ── */
    .req-dot { fill: #58a6ff; filter: url(#fg); }
    .pass-dot { fill: #2ea043; filter: url(#fg); }
    .reject-dot { fill: #f85149; filter: url(#fg); }
  </style>

  <!-- ══════ Background ══════ -->
  <rect width="1200" height="140" fill="url(#fbg)"/>

  <!-- Subtle grid -->
  <g class="fgrid">
    <line x1="0" y1="35" x2="1200" y2="35"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="105" x2="1200" y2="105"/>
  </g>

  <!-- ══════ SECTION 1: Incoming requests (left zone) ══════ -->
  <text x="100" y="20" class="label-header">INCOMING REQUESTS</text>

  <!-- Animated request packets flowing right -->
  <circle r="3.5" class="req-dot">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#req-path-1"/></animateMotion>
  </circle>
  <circle r="3" class="req-dot">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="0.8s"><mpath href="#req-path-2"/></animateMotion>
  </circle>
  <circle r="3.5" class="req-dot">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.5s"><mpath href="#req-path-3"/></animateMotion>
  </circle>
  <circle r="2.5" class="req-dot">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0.4s"><mpath href="#req-path-1"/></animateMotion>
  </circle>
  <circle r="3" class="req-dot">
    <animateMotion dur="3.2s" repeatCount="indefinite" begin="2s"><mpath href="#req-path-2"/></animateMotion>
  </circle>
  <circle r="2.5" class="req-dot">
    <animateMotion dur="3.8s" repeatCount="indefinite" begin="1s"><mpath href="#req-path-3"/></animateMotion>
  </circle>

  <!-- Rate limit labels along left -->
  <g transform="translate(280, 28)">
    <text x="0" y="0" class="label-header" style="font-size:6.5px; fill:#484f58;">X-RateLimit-Limit: 100</text>
    <text x="0" y="10" class="label-header" style="font-size:6.5px; fill:#484f58;">X-RateLimit-Remaining: 73</text>
  </g>

  <!-- ══════ SECTION 2: Token Bucket (center) ══════ -->
  <text x="570" y="16" class="label-bright">TOKEN BUCKET</text>

  <!-- Bucket outline -->
  <rect x="544" y="26" width="52" height="66" rx="5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Animated water level -->
  <g clip-path="url(#bucket-clip)">
    <rect x="546" y="52" width="48" height="38" class="bucket-water"/>
  </g>

  <!-- Token drops -->
  <circle cx="558" cy="24" r="2.5" class="token-drop" style="animation-delay:0s;"/>
  <circle cx="570" cy="24" r="2.5" class="token-drop" style="animation-delay:0.7s;"/>
  <circle cx="582" cy="24" r="2.5" class="token-drop" style="animation-delay:1.4s;"/>

  <!-- Token count display -->
  <text x="570" y="64" class="label-code" style="font-size:14px; fill:#58a6ff;">
    73
    <animate attributeName="textContent" values="73;72;71;70;71;72;73;74;75;74;73" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="570" y="78" class="label" style="font-size:7px;">tokens</text>

  <!-- Gate bars (flanking the bucket) -->
  <rect x="536" y="30" width="3" height="58" rx="1" fill="#1f6feb" class="gate-bar" opacity="0.5"/>
  <rect x="601" y="30" width="3" height="58" rx="1" fill="#1f6feb" class="gate-bar" opacity="0.5" style="animation-delay:0.5s;"/>

  <!-- ══════ Passed requests (right of gate) ══════ -->
  <text x="700" y="20" class="label-header" style="fill:#2ea043;">200 OK — ALLOWED</text>

  <circle r="3.5" class="pass-dot">
    <animateMotion dur="4s" repeatCount="indefinite" begin="1s"><mpath href="#pass-path-1"/></animateMotion>
  </circle>
  <circle r="3" class="pass-dot">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="2s"><mpath href="#pass-path-2"/></animateMotion>
  </circle>
  <circle r="3.5" class="pass-dot">
    <animateMotion dur="4.5s" repeatCount="indefinite" begin="0.5s"><mpath href="#pass-path-1"/></animateMotion>
  </circle>
  <circle r="2.5" class="pass-dot">
    <animateMotion dur="3.8s" repeatCount="indefinite" begin="3s"><mpath href="#pass-path-2"/></animateMotion>
  </circle>

  <!-- ══════ Rejected requests (deflected down) ══════ -->
  <text x="700" y="122" class="label-header" style="fill:#f85149;">429 — TOO MANY REQUESTS</text>

  <circle r="3" class="reject-dot">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="1.5s"><mpath href="#reject-path-1"/></animateMotion>
  </circle>
  <circle r="2.5" class="reject-dot">
    <animateMotion dur="3s" repeatCount="indefinite" begin="3.5s"><mpath href="#reject-path-2"/></animateMotion>
  </circle>

  <!-- ══════ SECTION 3: Throughput mini-chart (far right) ══════ -->
  <text x="1050" y="20" class="label-header">THROUGHPUT (req/s)</text>

  <!-- Chart bars -->
  <rect x="998" width="10" class="tbar tb1" fill="url(#bar-green)" y="95" height="0"/>
  <rect x="1014" width="10" class="tbar tb2" fill="url(#bar-green)" y="95" height="0"/>
  <rect x="1030" width="10" class="tbar tb3" fill="url(#bar-green)" y="95" height="0"/>
  <rect x="1046" width="10" class="tbar tb4" fill="url(#bar-red)" y="95" height="0"/>
  <rect x="1062" width="10" class="tbar tb5" fill="url(#bar-green)" y="95" height="0"/>
  <rect x="1078" width="10" class="tbar tb1" fill="url(#bar-green)" y="95" height="0" style="animation-delay:1.5s,3.5s;"/>
  <rect x="1094" width="10" class="tbar tb2" fill="url(#bar-red)" y="95" height="0" style="animation-delay:1.7s,3.7s;"/>

  <!-- Chart baseline -->
  <line x1="994" y1="96" x2="1108" y2="96" stroke="#30363d" stroke-width="0.8"/>

  <!-- Chart labels -->
  <text x="1050" y="108" class="label" style="font-size:7px;">time →</text>

  <!-- ══════ Sliding window indicator (bottom-left zone) ══════ -->
  <g transform="translate(120, 100)">
    <!-- Window dots (requests in window) -->
    <circle cx="0" cy="8" r="2" fill="#58a6ff" opacity="0.5"/>
    <circle cx="10" cy="8" r="2" fill="#58a6ff" opacity="0.7"/>
    <circle cx="20" cy="8" r="2" fill="#58a6ff" opacity="0.9"/>
    <circle cx="30" cy="8" r="2" fill="#58a6ff" opacity="0.6"/>
    <circle cx="40" cy="8" r="2" fill="#58a6ff" opacity="0.8"/>
    <circle cx="50" cy="8" r="2" fill="#484f58" opacity="0.3"/>
    <circle cx="60" cy="8" r="2" fill="#484f58" opacity="0.3"/>
    <circle cx="70" cy="8" r="2" fill="#484f58" opacity="0.3"/>

    <!-- Sliding window bracket -->
    <rect x="-6" y="0" width="52" height="16" rx="3" class="slide-window"/>

    <text x="35" y="30" class="label" style="font-size:7px;">SLIDING WINDOW</text>
  </g>

  <!-- Algo selector label -->
  <g transform="translate(380, 100)">
    <rect x="-38" y="-2" width="76" height="16" rx="8" fill="none" stroke="#30363d" stroke-width="0.8"/>
    <text x="0" y="10" class="label" style="font-size:7px; fill:#58a6ff;">ALGORITHM</text>
    <text x="0" y="28" class="label-header" style="font-size:6px;">Token Bucket · Sliding Window</text>
  </g>

  <!-- ══════ Subtle decorative edges ══════ -->
  <!-- Top edge line -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1f6feb" stroke-width="1" opacity="0.3"/>
  <!-- Bottom fade -->
  <rect y="132" width="1200" height="8" fill="url(#fbg)"/>
</svg>
