<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <linearGradient id="nbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#101820"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="bar-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb; stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#1f6feb; stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1f6feb; stop-opacity:0"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="stream-clip">
      <rect x="490" y="18" width="230" height="148"/>
    </clipPath>
  </defs>

  <style>
    @keyframes slideIn1 {
      0% { transform: translateX(60px); opacity: 0; }
      10% { transform: translateX(0); opacity: 1; }
      85% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(-60px); opacity: 0; }
    }
    .notif-1 { animation: slideIn1 8s ease-in-out infinite; }
    .notif-2 { animation: slideIn1 8s ease-in-out 2.6s infinite; }
    .notif-3 { animation: slideIn1 8s ease-in-out 5.2s infinite; }

    @keyframes dotDeliver {
      0%, 40% { fill: #d29922; r: 3; }
      50% { fill: #2ea043; r: 4; }
      60%, 100% { fill: #2ea043; r: 3; }
    }
    .status-dot { animation: dotDeliver 8s ease-in-out infinite; }
    .status-dot-2 { animation: dotDeliver 8s ease-in-out 2.6s infinite; }
    .status-dot-3 { animation: dotDeliver 8s ease-in-out 5.2s infinite; }

    @keyframes streamScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-52px); }
    }
    .stream-group { animation: streamScroll 4s linear infinite; }

    @keyframes partStream {
      0% { transform: translateX(0); opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { transform: translateX(8px); opacity: 0.3; }
    }
    .part-tick { animation: partStream 1.5s ease-in-out infinite; }

    .card-rect { fill: url(#card-bg); stroke: #30363d; stroke-width: 1; rx: 8; }
    .t-main { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 600; font-size: 11px; fill: #e6edf3; }
    .t-sub { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 400; font-size: 9px; fill: #8b949e; }
    .t-code { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 600; font-size: 9px; }
    .t-tiny { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 400; font-size: 7px; fill: #484f58; }
    .t-metric { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; fill: #e6edf3; }
    .t-header { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 600; font-size: 7.5px; fill: #484f58; }
  </style>

  <!-- Background -->
  <rect width="1200" height="180" fill="url(#nbg)"/>
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#f0883e" stroke-width="1" opacity="0.2"/>

  <!-- ══ SECTION 1: NOTIFICATION CARDS (left) ══ -->
  <text x="10" y="14" class="t-header">INCOMING NOTIFICATIONS</text>

  <!-- Card 1: OTP SMS -->
  <g class="notif-1" filter="url(#cardShadow)">
    <g transform="translate(12, 22)">
      <rect width="175" height="42" class="card-rect"/>
      <rect x="5" y="5" width="36" height="13" rx="6" fill="#f0883e" opacity="0.15" stroke="#f0883e" stroke-width="0.5"/>
      <text x="23" y="14.5" class="t-code" style="font-size:7px; fill:#f0883e;" text-anchor="middle">HIGH</text>
      <text x="155" y="15" style="font-size:13px;" text-anchor="middle">💬</text>
      <text x="48" y="14" class="t-main" style="font-size:9.5px;">OTP Verification</text>
      <text x="8" y="33" class="t-sub" style="font-size:8px; fill:#58a6ff;">Your code: <tspan class="t-code" style="fill:#e6edf3;">482913</tspan></text>
      <circle cx="165" cy="33" r="3" class="status-dot" fill="#d29922"/>
    </g>
  </g>

  <!-- Card 2: Welcome Email -->
  <g class="notif-2" filter="url(#cardShadow)">
    <g transform="translate(12, 70)">
      <rect width="175" height="42" class="card-rect"/>
      <rect x="5" y="5" width="36" height="13" rx="6" fill="#f0883e" opacity="0.15" stroke="#f0883e" stroke-width="0.5"/>
      <text x="23" y="14.5" class="t-code" style="font-size:7px; fill:#f0883e;" text-anchor="middle">HIGH</text>
      <text x="155" y="15" style="font-size:13px;" text-anchor="middle">✉️</text>
      <text x="48" y="14" class="t-main" style="font-size:9.5px;">Welcome Email</text>
      <text x="8" y="33" class="t-sub" style="font-size:8px;">Hello <tspan class="t-code" style="fill:#a371f7; font-size:8px;">Rahul</tspan>, welcome!</text>
      <circle cx="165" cy="33" r="3" class="status-dot-2" fill="#d29922"/>
    </g>
  </g>

  <!-- Card 3: Payment Push -->
  <g class="notif-3" filter="url(#cardShadow)">
    <g transform="translate(12, 118)">
      <rect width="175" height="42" class="card-rect"/>
      <rect x="5" y="5" width="30" height="13" rx="6" fill="#484f58" opacity="0.2" stroke="#484f58" stroke-width="0.5"/>
      <text x="20" y="14.5" class="t-code" style="font-size:7px; fill:#8b949e;" text-anchor="middle">LOW</text>
      <text x="155" y="15" style="font-size:13px;" text-anchor="middle">🔔</text>
      <text x="42" y="14" class="t-main" style="font-size:9.5px;">Payment Success</text>
      <text x="8" y="33" class="t-sub" style="font-size:8px;">₹2,499 received <tspan class="t-code" style="fill:#2ea043; font-size:7px;">✓</tspan></text>
      <circle cx="165" cy="33" r="3" class="status-dot-3" fill="#d29922"/>
    </g>
  </g>

  <!-- ══ SECTION 2: STATE PIPELINE (center-left) ══ -->
  <text x="205" y="14" class="t-header">DELIVERY PIPELINE</text>

  <g transform="translate(205, 30)">
    <!-- QUEUED -->
    <rect x="0" y="0" width="68" height="26" rx="5" fill="none" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="34" y="14" class="t-code" style="font-size:8px; fill:#8b949e;" text-anchor="middle">QUEUED</text>
    <text x="34" y="24" class="t-tiny" text-anchor="middle" style="font-size:5.5px;">waiting</text>

    <line x1="72" y1="13" x2="82" y2="13" stroke="#30363d" stroke-width="1"/>
    <polygon points="82,10 88,13 82,16" fill="#30363d"/>

    <!-- DISPATCHED -->
    <rect x="90" y="0" width="78" height="26" rx="5" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="129" y="14" class="t-code" style="font-size:8px; fill:#58a6ff;" text-anchor="middle">DISPATCHED</text>
    <text x="129" y="24" class="t-tiny" text-anchor="middle" style="font-size:5.5px;">in transit</text>
    <rect x="92" y="2" width="0" height="22" rx="4" fill="url(#bar-fill)" opacity="0.5">
      <animate attributeName="width" values="0;74;0" dur="3s" repeatCount="indefinite"/>
    </rect>

    <line x1="172" y1="13" x2="182" y2="13" stroke="#30363d" stroke-width="1"/>
    <polygon points="182,10 188,13 182,16" fill="#30363d"/>

    <!-- DELIVERED -->
    <rect x="190" y="0" width="76" height="26" rx="5" fill="none" stroke="#2ea043" stroke-width="1.2"/>
    <text x="228" y="14" class="t-code" style="font-size:8px; fill:#2ea043;" text-anchor="middle">DELIVERED</text>
    <text x="228" y="24" class="t-tiny" text-anchor="middle" style="font-size:5.5px; fill:#2ea043;">confirmed</text>
    <circle cx="228" cy="13" r="8" fill="none" stroke="#2ea043" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="8;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Failed → Retry → DLQ -->
  <g transform="translate(205, 62)">
    <rect x="90" y="8" width="58" height="22" rx="5" fill="none" stroke="#f85149" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="119" y="22" class="t-code" style="font-size:7.5px; fill:#f85149;" text-anchor="middle">FAILED</text>
    <path d="M 95 30 Q 80 48 105 48 Q 130 48 125 35" fill="none" stroke="#d29922" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
    <polygon points="126,38 128,33 123,35" fill="#d29922" opacity="0.5"/>
    <text x="108" y="60" class="t-tiny" style="font-size:5.5px; fill:#d29922;" text-anchor="middle">retry w/ backoff</text>
    <line x1="150" y1="19" x2="168" y2="19" stroke="#30363d" stroke-width="1"/>
    <polygon points="168,16 174,19 168,22" fill="#f85149" opacity="0.5"/>
    <rect x="176" y="8" width="38" height="22" rx="5" fill="none" stroke="#f85149" stroke-width="1"/>
    <text x="195" y="22" class="t-code" style="font-size:7.5px; fill:#f85149;" text-anchor="middle">DLQ</text>
  </g>

  <!-- ══ SECTION 3: LIVE AUDIT LOG (center-right) ══ -->
  <text x="490" y="14" class="t-header">LIVE AUDIT LOG</text>
  <rect x="490" y="18" width="230" height="148" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <g clip-path="url(#stream-clip)">
    <g class="stream-group">
      <g transform="translate(498, 26)">
        <circle cx="6" cy="8" r="3" fill="#2ea043"/>
        <text x="16" y="5" class="t-code" style="font-size:7px; fill:#2ea043;">DELIVERED</text>
        <text x="16" y="15" class="t-tiny" style="font-size:6px;">otp-user-42 → SMS</text>
        <text x="210" y="10" class="t-tiny" style="font-size:6px; text-anchor:end;">0.8s</text>
      </g>
      <g transform="translate(498, 52)">
        <circle cx="6" cy="8" r="3" fill="#2ea043"/>
        <text x="16" y="5" class="t-code" style="font-size:7px; fill:#2ea043;">DELIVERED</text>
        <text x="16" y="15" class="t-tiny" style="font-size:6px;">welcome-77 → Email</text>
        <text x="210" y="10" class="t-tiny" style="font-size:6px; text-anchor:end;">1.2s</text>
      </g>
      <g transform="translate(498, 78)">
        <circle cx="6" cy="8" r="3" fill="#d29922"/>
        <text x="16" y="5" class="t-code" style="font-size:7px; fill:#d29922;">RETRY #2</text>
        <text x="16" y="15" class="t-tiny" style="font-size:6px;">promo-103 → Push</text>
        <text x="210" y="10" class="t-tiny" style="font-size:6px; text-anchor:end;">4.0s</text>
      </g>
      <g transform="translate(498, 104)">
        <circle cx="6" cy="8" r="3" fill="#2ea043"/>
        <text x="16" y="5" class="t-code" style="font-size:7px; fill:#2ea043;">DELIVERED</text>
        <text x="16" y="15" class="t-tiny" style="font-size:6px;">payment-218 → Push</text>
        <text x="210" y="10" class="t-tiny" style="font-size:6px; text-anchor:end;">0.5s</text>
      </g>
      <g transform="translate(498, 130)">
        <circle cx="6" cy="8" r="3" fill="#8b949e"/>
        <text x="16" y="5" class="t-code" style="font-size:7px; fill:#8b949e;">SKIPPED</text>
        <text x="16" y="15" class="t-tiny" style="font-size:6px;">otp-user-42 → duplicate</text>
        <text x="210" y="10" class="t-tiny" style="font-size:6px; text-anchor:end;">—</text>
      </g>
      <g transform="translate(498, 156)">
        <circle cx="6" cy="8" r="3" fill="#2ea043"/>
        <text x="16" y="5" class="t-code" style="font-size:7px; fill:#2ea043;">DELIVERED</text>
        <text x="16" y="15" class="t-tiny" style="font-size:6px;">reset-pw-89 → Email</text>
        <text x="210" y="10" class="t-tiny" style="font-size:6px; text-anchor:end;">1.0s</text>
      </g>
      <g transform="translate(498, 182)">
        <circle cx="6" cy="8" r="3" fill="#f85149"/>
        <text x="16" y="5" class="t-code" style="font-size:7px; fill:#f85149;">DLQ</text>
        <text x="16" y="15" class="t-tiny" style="font-size:6px;">alert-55 → SMS failed</text>
        <text x="210" y="10" class="t-tiny" style="font-size:6px; text-anchor:end;">16.0s</text>
      </g>
    </g>
  </g>

  <!-- ══ SECTION 4: METRICS (right) ══ -->
  <text x="740" y="14" class="t-header">METRICS</text>

  <!-- Throughput -->
  <g transform="translate(740, 24)">
    <text x="0" y="10" class="t-tiny" style="font-size:7px;">Throughput</text>
    <text x="0" y="28" class="t-metric" style="font-size:22px; fill:#2ea043;">50K+</text>
    <text x="56" y="28" class="t-tiny" style="font-size:8px; fill:#8b949e;">/hr</text>
  </g>

  <!-- Channel bars -->
  <g transform="translate(740, 62)">
    <text x="0" y="8" class="t-tiny" style="font-size:7px;">Channels</text>
    <text x="0" y="24" style="font-size:9px;">✉️</text>
    <rect x="18" y="16" width="80" height="10" rx="3" fill="#161b22" stroke="#21262d" stroke-width="0.5"/>
    <rect x="18" y="16" width="0" height="10" rx="3" fill="#a371f7" opacity="0.6">
      <animate attributeName="width" values="0;56;56" dur="2s" fill="freeze" begin="0.5s"/>
    </rect>
    <text x="103" y="24" class="t-tiny" style="font-size:6.5px; fill:#a371f7;">42%</text>

    <text x="0" y="40" style="font-size:9px;">💬</text>
    <rect x="18" y="32" width="80" height="10" rx="3" fill="#161b22" stroke="#21262d" stroke-width="0.5"/>
    <rect x="18" y="32" width="0" height="10" rx="3" fill="#58a6ff" opacity="0.6">
      <animate attributeName="width" values="0;44;44" dur="2s" fill="freeze" begin="0.8s"/>
    </rect>
    <text x="103" y="40" class="t-tiny" style="font-size:6.5px; fill:#58a6ff;">33%</text>

    <text x="0" y="56" style="font-size:9px;">🔔</text>
    <rect x="18" y="48" width="80" height="10" rx="3" fill="#161b22" stroke="#21262d" stroke-width="0.5"/>
    <rect x="18" y="48" width="0" height="10" rx="3" fill="#2ea043" opacity="0.6">
      <animate attributeName="width" values="0;34;34" dur="2s" fill="freeze" begin="1.1s"/>
    </rect>
    <text x="103" y="56" class="t-tiny" style="font-size:6.5px; fill:#2ea043;">25%</text>
  </g>

  <!-- Status counters -->
  <g transform="translate(740, 132)">
    <rect x="0" y="0" width="42" height="30" rx="5" fill="#161b22" stroke="#2ea043" stroke-width="0.8"/>
    <text x="21" y="13" class="t-metric" style="font-size:11px; fill:#2ea043;" text-anchor="middle">99.2</text>
    <text x="21" y="23" class="t-tiny" style="font-size:5.5px; fill:#2ea043;" text-anchor="middle">% success</text>

    <rect x="48" y="0" width="35" height="30" rx="5" fill="#161b22" stroke="#d29922" stroke-width="0.8"/>
    <text x="65" y="13" class="t-metric" style="font-size:11px; fill:#d29922;" text-anchor="middle">12</text>
    <text x="65" y="23" class="t-tiny" style="font-size:5.5px; fill:#d29922;" text-anchor="middle">retries</text>

    <rect x="89" y="0" width="30" height="30" rx="5" fill="#161b22" stroke="#f85149" stroke-width="0.8"/>
    <text x="104" y="13" class="t-metric" style="font-size:11px; fill:#f85149;" text-anchor="middle">1</text>
    <text x="104" y="23" class="t-tiny" style="font-size:5.5px; fill:#f85149;" text-anchor="middle">DLQ</text>
  </g>

  <!-- ══ SECTION 5: KAFKA + IDEMPOTENCY (bottom-left) ══ -->
  <g transform="translate(205, 128)">
    <text x="0" y="0" class="t-header" style="font-size:6.5px;">KAFKA PARTITIONS</text>
    <text x="0" y="12" class="t-tiny" style="font-size:5.5px; fill:#f0883e;">HIGH ×6</text>
    <g transform="translate(36, 6)">
      <rect x="0" y="0" width="3" height="6" rx="1" fill="#f0883e" opacity="0.4" class="part-tick"/>
      <rect x="5" y="0" width="3" height="6" rx="1" fill="#f0883e" opacity="0.6" class="part-tick" style="animation-delay:0.2s;"/>
      <rect x="10" y="0" width="3" height="6" rx="1" fill="#f0883e" opacity="0.3" class="part-tick" style="animation-delay:0.4s;"/>
      <rect x="15" y="0" width="3" height="6" rx="1" fill="#f0883e" opacity="0.7" class="part-tick" style="animation-delay:0.6s;"/>
      <rect x="20" y="0" width="3" height="6" rx="1" fill="#f0883e" opacity="0.5" class="part-tick" style="animation-delay:0.8s;"/>
      <rect x="25" y="0" width="3" height="6" rx="1" fill="#f0883e" opacity="0.4" class="part-tick" style="animation-delay:1s;"/>
    </g>
    <text x="0" y="26" class="t-tiny" style="font-size:5.5px; fill:#8b949e;">LOW  ×3</text>
    <g transform="translate(36, 20)">
      <rect x="0" y="0" width="3" height="6" rx="1" fill="#8b949e" opacity="0.3" class="part-tick" style="animation-delay:0.3s;"/>
      <rect x="5" y="0" width="3" height="6" rx="1" fill="#8b949e" opacity="0.5" class="part-tick" style="animation-delay:0.7s;"/>
      <rect x="10" y="0" width="3" height="6" rx="1" fill="#8b949e" opacity="0.4" class="part-tick" style="animation-delay:1.1s;"/>
    </g>
  </g>

  <!-- Idempotency -->
  <g transform="translate(340, 128)">
    <text x="0" y="0" class="t-header" style="font-size:6.5px;">IDEMPOTENCY</text>
    <rect x="0" y="5" width="70" height="20" rx="4" fill="#161b22" stroke="#da3633" stroke-width="0.8"/>
    <text x="10" y="18" class="t-code" style="font-size:7px; fill:#da3633;">SETNX</text>
    <circle cx="60" cy="15" r="4" fill="none" stroke="#2ea043" stroke-width="1">
      <animate attributeName="stroke" values="#d29922;#2ea043;#2ea043" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="17.5" class="t-code" style="font-size:6px; fill:#2ea043;" text-anchor="middle">✓</text>
    <text x="35" y="36" class="t-tiny" style="font-size:5.5px; fill:#da3633;" text-anchor="middle">dedup via Redis</text>
  </g>

  <rect y="174" width="1200" height="6" fill="url(#nbg)"/>
</svg>
